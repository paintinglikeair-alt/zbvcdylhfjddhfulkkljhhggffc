 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاحنة التفاح - الآحاد والعشرات والمئات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #fef2f2;
            background-image: radial-gradient(#fecaca 2px, transparent 2px);
            background-size: 30px 30px;
            overflow-x: hidden;
        }

        /* */
        .btn-playful {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 6px 0 rgb(185 28 28); /* Red-700 */
        }
        .btn-playful:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 rgb(185 28 28);
        }

        .btn-action {
            transition: all 0.1s;
        }
        .btn-action:active {
            transform: scale(0.95);
        }

        .item-drop {
            animation: dropIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes dropIn {
            0% { transform: translateY(-50px) scale(0.5); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        .truck-container {
            background: linear-gradient(to bottom, #d1d5db 0%, #9ca3af 100%);
            border-bottom: 12px solid #374151;
            border-radius: 1rem 1rem 0.5rem 0.5rem;
            position: relative;
        }
        
        .wheel {
            width: 50px;
            height: 50px;
            background-color: #1f2937;
            border: 6px solid #e5e7eb;
            border-radius: 50%;
            position: absolute;
            bottom: -25px;
        }

        /* Floating decoration */
        .floating {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body class="min-h-screen text-gray-800 flex flex-col items-center py-6 px-4">

    <!-- -->
    <header class="w-full max-w-4xl text-center mb-8 relative z-10">
        <div class="bg-white rounded-3xl p-6 shadow-xl border-4 border-red-400 relative overflow-hidden">
            <div class="absolute -top-4 -right-4 text-6xl opacity-20 floating">🍎</div>
            <div class="absolute bottom-2 left-4 text-4xl opacity-30 floating" style="animation-delay: 1s;">📦</div>
            
            <h1 class="text-3xl md:text-5xl font-black text-red-700 mb-2 flex justify-center items-center gap-3">
                <span>🚚</span> شركة نقل التفاح <span>🍎</span>
            </h1>
            <p class="text-lg md:text-xl text-gray-600 font-bold mb-4">
                ساعد في تحميل الشاحنة بالكمية المطلوبة من التفاح!
            </p>
            
            <div class="bg-red-50 border-4 border-red-200 rounded-2xl p-4 inline-block mt-2">
                <p class="text-red-900 font-bold text-lg mb-1">المهمة الحالية: رقم <span id="levelNum">1</span></p>
                <div class="text-4xl md:text-6xl font-black text-red-600 font-mono flex items-center justify-center gap-4" dir="ltr">
                    <span id="targetAmount">345</span>
                    <span class="text-4xl">🍎</span>
                </div>
            </div>
        </div>
    </header>

    <!-- -->
    <main class="w-full max-w-4xl flex flex-col md:flex-row gap-6 z-10">
        
        <!-- أدوات الإضافة (المخزن) -->
        <div class="w-full md:w-1/3 bg-white p-6 rounded-3xl shadow-lg border-4 border-orange-300 flex flex-col gap-4">
            <h2 class="text-2xl font-black text-orange-800 text-center mb-2 border-b-2 border-orange-100 pb-2">المخزن</h2>
            
            <!-- إضافة مئات -->
            <button onclick="addItem(100)" class="btn-action bg-orange-100 hover:bg-orange-200 border-2 border-orange-400 rounded-2xl p-3 flex items-center justify-between group">
                <div class="flex items-center gap-3">
                    <div class="relative inline-block">
                        <span class="text-4xl group-hover:scale-110 transition-transform block">📦</span>
                        <span class="absolute -top-1 -right-2 text-xl drop-shadow-sm">🍎</span>
                    </div>
                    <div class="text-right">
                        <p class="font-black text-orange-900 text-xl">كرتونة</p>
                        <p class="text-sm font-bold text-orange-700">100 تفاحة (مئات)</p>
                    </div>
                </div>
                <span class="bg-orange-500 text-white font-black rounded-full w-8 h-8 flex items-center justify-center">+</span>
            </button>

            <!-- إضافة عشرات -->
            <button onclick="addItem(10)" class="btn-action bg-green-100 hover:bg-green-200 border-2 border-green-400 rounded-2xl p-3 flex items-center justify-between group">
                <div class="flex items-center gap-3">
                    <div class="relative inline-block">
                        <span class="text-4xl group-hover:scale-110 transition-transform block">🧺</span>
                        <span class="absolute -top-1 -right-2 text-xl drop-shadow-sm">🍎</span>
                    </div>
                    <div class="text-right">
                        <p class="font-black text-green-900 text-xl">سَبَت</p>
                        <p class="text-sm font-bold text-green-700">10 تفاحات (عشرات)</p>
                    </div>
                </div>
                <span class="bg-green-500 text-white font-black rounded-full w-8 h-8 flex items-center justify-center">+</span>
            </button>

            <!-- إضافة آحاد -->
            <button onclick="addItem(1)" class="btn-action bg-red-100 hover:bg-red-200 border-2 border-red-400 rounded-2xl p-3 flex items-center justify-between group">
                <div class="flex items-center gap-3">
                    <span class="text-4xl group-hover:scale-110 transition-transform">🍎</span>
                    <div class="text-right">
                        <p class="font-black text-red-900 text-xl">تفاحة</p>
                        <p class="text-sm font-bold text-red-700">تفاحة واحدة (آحاد)</p>
                    </div>
                </div>
                <span class="bg-red-500 text-white font-black rounded-full w-8 h-8 flex items-center justify-center">+</span>
            </button>
        </div>

        <!-- -->
        <div class="w-full md:w-2/3 flex flex-col gap-4">
            
            <!-- الشاحنة -->
            <div class="bg-blue-50 p-6 rounded-3xl shadow-lg border-4 border-blue-300 relative mt-4">
                <div class="flex justify-between items-end mb-2">
                    <h2 class="text-2xl font-black text-blue-800 flex items-center gap-2">
                        <span>🚚</span> صندوق الشاحنة
                    </h2>
                    <div class="bg-blue-200 text-blue-900 px-4 py-2 rounded-xl font-black text-xl flex gap-2" dir="ltr">
                        <span id="currentTotalDisplay">0</span>
                        <span>/</span>
                        <span id="targetDisplaySmall" class="text-blue-600">345</span>
                    </div>
                </div>

                <!-- مساحة العرض المرئي للعناصر -->
                <div class="truck-container min-h-[200px] p-4 flex flex-wrap content-start gap-2 shadow-inner relative mb-6">
                    <div id="truckItems" class="w-full flex flex-wrap gap-2">
                        <!-- العناصر المُضافة تظهر هنا -->
                        <div class="w-full h-full flex items-center justify-center absolute inset-0 pointer-events-none opacity-40">
                            <span class="text-gray-600 font-bold text-xl" id="emptyMessage">الشاحنة فارغة...</span>
                        </div>
                    </div>
                    
                    <!-- عجلات الشاحنة للتصميم -->
                    <div class="wheel right-8"></div>
                    <div class="wheel left-8"></div>
                </div>

                <!-- أزرار التحكم بالشاحنة -->
                <div class="flex gap-3 justify-center mt-8">
                    <button onclick="clearTruck()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-3 px-6 rounded-xl text-lg flex items-center gap-2 transition-colors">
                        <span>🗑️</span> تفريغ
                    </button>
                    <button onclick="checkDelivery()" class="btn-playful bg-blue-600 hover:bg-blue-700 text-white font-black py-3 px-10 rounded-xl text-2xl flex-1 flex justify-center items-center gap-2">
                        <span>✅</span> تسليم الطلب
                    </button>
                </div>
            </div>

        </div>
    </main>

    <!-- -->
    <!-- رسالة النجاح -->
    <div id="successMessage" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-3xl p-8 shadow-2xl border-8 border-green-400 text-center max-w-md w-full transform scale-95 transition-transform duration-300 relative">
            <div class="absolute -top-12 left-1/2 transform -translate-x-1/2 text-8xl drop-shadow-md">🎉</div>
            <h2 class="text-3xl font-black text-green-700 mt-6 mb-2">ممتاز جداً!</h2>
            <p class="text-xl text-gray-700 font-bold mb-6">لقد قمت بتحميل الكمية المطلوبة بدقة.</p>
            <div class="bg-green-50 p-4 rounded-xl mb-6 text-2xl font-black text-green-800 font-mono" dir="ltr" id="successEquation">
                300 + 40 + 5 = 345
            </div>
            <button onclick="nextLevel()" class="btn-playful bg-green-500 hover:bg-green-600 text-white font-black py-3 px-8 rounded-xl text-2xl w-full">
                المهمة التالية 🚀
            </button>
        </div>
    </div>

    <!-- رسالة خطأ (أكثر أو أقل) -->
    <div id="errorMessage" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-3xl p-8 shadow-2xl border-8 border-red-400 text-center max-w-md w-full transform scale-95 transition-transform duration-300 relative">
            <div class="absolute -top-12 left-1/2 transform -translate-x-1/2 text-8xl drop-shadow-md">🤔</div>
            <h2 class="text-3xl font-black text-red-700 mt-6 mb-2">راجع حمولتك!</h2>
            <p id="errorText" class="text-xl text-gray-700 font-bold mb-6">الكمية في الشاحنة لا تتطابق مع الطلب.</p>
            <button onclick="closeError()" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-black py-3 px-8 rounded-xl text-xl w-full transition-colors">
                حسناً، سأحاول مجدداً 🔄
            </button>
        </div>
    </div>

    <script>
        const levels = [
            { target: 24, label: "المستوى الأول" },
            { target: 135, label: "المستوى الثاني" },
            { target: 308, label: "المستوى الثالث" },
            { target: 520, label: "المستوى الرابع" },
            { target: 777, label: "المستوى الخامس (تحدي التفاح الكبير)" }
        ];

        let currentLevelIndex = 0;
        let currentTarget = 0;
        let currentTotal = 0;
        let itemsCounts = { 100: 0, 10: 0, 1: 0 }; // كم عدد الكراتين، الأسبتة، والتفاح

        window.onload = () => {
            loadLevel(currentLevelIndex);
        };

        function loadLevel(index) {
            currentTarget = levels[index].target;
            document.getElementById('levelNum').innerText = (index + 1);
            document.getElementById('targetAmount').innerText = currentTarget;
            document.getElementById('targetDisplaySmall').innerText = currentTarget;
            
            clearTruck();
        }

        function addItem(value) {
            // Prevent adding too many items to avoid layout breaking totally
            if (currentTotal + value > 999) {
                showError("لا يمكن للشاحنة حمل أكثر من 999 تفاحة!");
                return;
            }

            currentTotal += value;
            itemsCounts[value]++;
            
            updateDisplay();
            
            // Add visual element to truck
            const truckContainer = document.getElementById('truckItems');
            const itemDiv = document.createElement('div');
            itemDiv.className = "item-drop flex items-center justify-center bg-white/80 rounded-lg shadow-sm border border-black/10 select-none";
            
            let emoji = '';
            let sizeClass = '';
            if (value === 100) { emoji = '<div class="relative">📦<span class="absolute -top-1 -right-2 text-lg drop-shadow-sm">🍎</span></div>'; sizeClass = 'text-4xl p-2 w-16 h-16 bg-orange-100/80 border-orange-300'; }
            if (value === 10)  { emoji = '<div class="relative">🧺<span class="absolute -top-1 -right-2 text-sm drop-shadow-sm">🍎</span></div>'; sizeClass = 'text-3xl p-1 w-12 h-12 bg-green-100/80 border-green-300'; }
            if (value === 1)   { emoji = '🍎'; sizeClass = 'text-2xl p-1 w-8 h-8 bg-red-100/80 border-red-300'; }
            
            itemDiv.className += ` ${sizeClass}`;
            itemDiv.innerHTML = emoji;
            
            truckContainer.appendChild(itemDiv);
        }

        function updateDisplay() {
            document.getElementById('currentTotalDisplay').innerText = currentTotal;
            
            const emptyMsg = document.getElementById('emptyMessage');
            if (currentTotal > 0) {
                emptyMsg.style.display = 'none';
            } else {
                emptyMsg.style.display = 'block';
            }
        }

        function clearTruck() {
            currentTotal = 0;
            itemsCounts = { 100: 0, 10: 0, 1: 0 };
            document.getElementById('truckItems').innerHTML = `
                <div class="w-full h-full flex items-center justify-center absolute inset-0 pointer-events-none opacity-40">
                    <span class="text-gray-600 font-bold text-xl" id="emptyMessage">الشاحنة فارغة...</span>
                </div>
            `;
            updateDisplay();
        }

        function checkDelivery() {
            if (currentTotal === currentTarget) {
                showSuccess();
            } else if (currentTotal < currentTarget) {
                showError(`الكمية ناقصة! أنت حملت ${currentTotal} والمطلوب ${currentTarget}.`);
            } else {
                showError(`الكمية زائدة! أنت حملت ${currentTotal} والمطلوب ${currentTarget}.`);
            }
        }

        function showSuccess() {
            const modal = document.getElementById('successMessage');
            const eqBox = document.getElementById('successEquation');
            
            // Build the expanded form equation (الصيغة الممتدة)
            let terms = [];
            if (itemsCounts[100] > 0) terms.push(itemsCounts[100] * 100);
            if (itemsCounts[10] > 0) terms.push(itemsCounts[10] * 10);
            if (itemsCounts[1] > 0) terms.push(itemsCounts[1] * 1);
            
            eqBox.innerText = terms.join(" + ") + " = " + currentTarget;
            
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.firstElementChild.classList.remove('scale-95');
                modal.firstElementChild.classList.add('scale-100');
            }, 10);
        }

        function showError(msgText) {
            const modal = document.getElementById('errorMessage');
            document.getElementById('errorText').innerText = msgText;
            
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.firstElementChild.classList.remove('scale-95');
                modal.firstElementChild.classList.add('scale-100');
            }, 10);
        }

        function closeError() {
            const modal = document.getElementById('errorMessage');
            modal.firstElementChild.classList.remove('scale-100');
            modal.firstElementChild.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        function nextLevel() {
            const modal = document.getElementById('successMessage');
            modal.classList.add('hidden');
            modal.firstElementChild.classList.remove('scale-100');
            modal.firstElementChild.classList.add('scale-95');

            currentLevelIndex++;
            if (currentLevelIndex >= levels.length) {
                // عرض رسالة النهاية وإعادة اللعبة
                document.getElementById('errorText').innerText = "أنت بطل حقيقي! لقد أنهيت جميع مهام شركة نقل التفاح بنجاح! 🎉🍎";
                document.getElementById('errorMessage').classList.remove('hidden');
                currentLevelIndex = 0;
            }
            loadLevel(currentLevelIndex);
        }
    </script>
</body>
</html>
